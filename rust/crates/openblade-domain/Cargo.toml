[package]
name = "openblade-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Pure bounded parsing/commitments use allocation and std::io error values;
# no platform APIs. The existing allocation-free policy core stays no_std.
thermal-history = ["dep:serde", "dep:serde_json", "dep:sha2"]
# The managed ProfileSet model, codec and validator. Pure rules over std
# collections with their own JSON reader and writer; no serde, no platform APIs.
profile-set = []
# The native Service's durable keyboard Driver-mode ownership record: its
# strict line codec and transitions. Pure std; the host owns the file.
driver-mode-history = []

[dependencies]
openblade-types.workspace = true

serde = { version = '=1.0.228', features = ['derive'], optional = true }
serde_json = { version = '=1.0.149', features = ['arbitrary_precision'], optional = true }
sha2 = { version = '=0.10.9', optional = true }

[dev-dependencies]
serde = { version = '=1.0.228', features = ['derive'] }
serde_json = '=1.0.149'
