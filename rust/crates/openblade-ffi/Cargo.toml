[package]
name = "openblade-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Only the C adapter may dereference borrowed caller pointers and export symbols.
# Inner crates continue to inherit the workspace unsafe_code = forbid policy.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
openblade-types.workspace = true
openblade-protocol.workspace = true
openblade-domain.workspace = true
