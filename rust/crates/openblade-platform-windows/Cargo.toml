[package]
name = "openblade-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
foreground-watcher = ["windows-sys/Win32_UI_Accessibility"]
foreground-watcher-replay = ["foreground-watcher"]

[target.'cfg(windows)'.dependencies]
openblade-application-reporter = { path = "../openblade-application-reporter" }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
