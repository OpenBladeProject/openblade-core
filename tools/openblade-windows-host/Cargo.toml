[package]
name = "openblade-windows-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false
default-run = "openblade-windows-host"

# Development-only workspace, outside the product dependency graph.
[workspace]

[[bin]]
name = "openblade-windows-discovery"
path = "src/discover.rs"

[features]
native-agent-entry-compile-check = ["windows-sys/Win32_System_RemoteDesktop"]
cpu-worker-fixture = []
scratch-writer-fence = []
gpu-close-fixture = ["openblade-platform-windows/scripted-gpu-close"]
vm-scm-fixture = []
installed-service-candidate = ["windows-sys/Win32_System_RemoteDesktop"]
hid-identity-compile-check = []
controller-admission-compile-check = ["openblade-platform-windows/controller-process-compile-check"]
lifecycle-evidence-compile-check = [
    "windows-sys/Win32_System_Power",
    "windows-sys/Win32_System_RemoteDesktop",
    "windows-sys/Win32_System_SystemServices",
]

[[bin]]
name = "openblade-cpu-worker-fixture"
path = "tests/fixtures/cpu_worker.rs"
required-features = ["cpu-worker-fixture"]
test = false
bench = false

[[bin]]
name = "openblade-rust-session-agent"
path = "src/session_agent.rs"
[[bin]]
name = "openblade-windows-scm-vm"
path = "src/vm_main.rs"
required-features = ["vm-scm-fixture"]
test = false

[[bin]]
name = "openblade-windows-service-candidate"
path = "src/installed_main.rs"
required-features = ["installed-service-candidate"]

[[bin]]
name = "openblade-windows-agent-candidate"
path = "src/installed_agent_main.rs"
required-features = ["native-agent-entry-compile-check"]

[dependencies]
openblade-domain = { path = '../../rust/crates/openblade-domain' }
openblade-protocol = { path = '../../rust/crates/openblade-protocol' }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
openblade-application-reporter = { path = '../../rust/crates/openblade-application-reporter' }
openblade-types = { path = '../../rust/crates/openblade-types' }

[target.'cfg(windows)'.dependencies]
openblade-application-reporter = { path = '../../rust/crates/openblade-application-reporter' }
openblade-platform-windows = { path = '../../rust/crates/openblade-platform-windows', features = ["scripted-display", "scripted-gpu", "foreground-watcher-replay"] }
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Globalization",
    "Win32_Networking_WindowsWebServices",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "openblade-scratch-rust-writer"
path = "tests/fixtures/writer_fence.rs"
required-features = ["scratch-writer-fence"]
test = false
bench = false
