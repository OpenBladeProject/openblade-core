[package]
name = "openblade-windows-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
publish = false

# Development-only workspace, outside the product dependency graph.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
