name: Support my laptop
description: Ask OpenBlade to support a Razer laptop it doesn't support yet.
title: "Support my laptop: "
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping OpenBlade support more laptops. Follow the [Synapse Observer guide](https://github.com/OpenBladeProject/synapse-observer#send-evidence) to collect device information, optionally record Synapse settings, and save an evidence ZIP. Review the ZIP before attaching it below; issues and attachments are public. A device-information ZIP is useful even if recording is unavailable.

        Search existing device-support requests for your model before opening a new one. If OpenBlade also saved `OpenBlade-identity-report.zip`, attach it alongside the observer ZIP. An identity report from an older OpenBlade version is also accepted.
  - type: input
    id: laptop-name
    attributes:
      label: Laptop name
      description: The name on the box or in Razer Synapse.
      placeholder: Razer Blade 18 (2023)
    validations:
      required: true
  - type: input
    id: model-number
    attributes:
      label: Model number
      description: It starts with RZ09 and is printed on the label under the laptop.
      placeholder: RZ09-0484
    validations:
      required: true
  - type: input
    id: bios-version
    attributes:
      label: BIOS version
      description: Open System Information (`msinfo32`) and copy **BIOS Version/Date**.
    validations:
      required: true
  - type: input
    id: openblade-version
    attributes:
      label: OpenBlade version (if installed)
      description: Open OpenBlade and go to **About**. Leave this blank if you only used Synapse Observer.
      placeholder: 0.27.3
    validations:
      required: false
  - type: upload
    id: identity-report
    attributes:
      label: Evidence ZIP
      description: Attach the ZIP saved by Synapse Observer, or an OpenBlade identity report. Include any collection errors or skipped settings in the notes below.
    validations:
      required: true
      accept: ".zip"
  - type: textarea
    id: synapse-features
    attributes:
      label: Synapse features and collection notes (optional)
      description: List the controls Synapse offers, which settings you recorded, your Synapse and Observer versions, and any errors, skipped steps, or settings you could not restore.
