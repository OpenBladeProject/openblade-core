name: Rust

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Service.Tests/ServiceControlRuntimeTests.RustBatteryParity.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  # No base-branch filter: migration PRs can be stacked before reaching main.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Service.Tests/ServiceControlRuntimeTests.RustBatteryParity.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install pinned toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Rustup reads the toolchain, profile and components from the TOML file.
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains 'host: ${{ matrix.target }}') {
            throw 'The runner must execute the selected target natively.'
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check workspace boundaries
        run: ./Check-Workspace.ps1

      - name: Test workspace guard
        run: ./Test-WorkspaceCheck.ps1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Verify unsupported transport output
        if: runner.os != 'Windows'
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'openblade-status-unsupported.txt'
          $output = & "./target/${{ matrix.target }}/debug/openblade-status-cli" 2> $diagnostic
          $code = $LASTEXITCODE
          if ($code -ne 1 -or $output) { throw 'Unsupported transport invented a successful status.' }
          if ((Get-Content $diagnostic -Raw).Trim() -cne 'OpenBlade status: unsupported transport (Windows named pipe required)') {
            throw 'Unsupported transport diagnostic changed.'
          }
          exit 0

      - name: Test workspace and all 43 canonical report and profile cases
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test the macOS discovery pilot
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Smoke the macOS discovery CLI
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $binary = '../tools/openblade-discovery/target/${{ matrix.target }}/debug/openblade-discovery'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one discovery snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'macos' -or
              $snapshot.hostMetadata -cne 'unverified' -or -not $snapshot.Contains('exactModel') -or
              $null -ne $snapshot.exactModel -or
              $snapshot.hid.state -cnotin @('none', 'single', 'ambiguous', 'incomplete')) {
            throw 'Invalid discovery snapshot or unavailable hosted macOS metadata APIs.'
          }

      - name: Verify the isolated Windows Rust service host
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $env:OPENBLADE_RUST_DEV_HOST_EXE = (Resolve-Path '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-host.exe').Path
          dotnet restore ../src/OpenBlade.Tray/OpenBlade.Tray.csproj
          dotnet test ../tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj --filter FullyQualifiedName~RustReadOnlyHostTests
          dotnet test ../tests/OpenBlade.Service.Tests/OpenBlade.Service.Tests.csproj --filter FullyQualifiedName~RustBatteryParity

      - name: Smoke Windows discovery metadata on the hosted VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-discovery.exe'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one Windows metadata snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'unsupported' -or
              $snapshot.registryMatch.state -cnotin @('unknown', 'incomplete') -or
              $snapshot.hid.inventory -cnotin @('complete', 'incomplete') -or
              $snapshot.hid.candidates -cne 'notEvaluated' -or $null -ne $snapshot.hid.counts) {
            throw "Unexpected hosted Windows discovery result: $output"
          }
          Write-Output $output

      - name: Smoke native SCM lifecycle on the hosted Windows VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: ../tools/openblade-windows-host/Test-HostedScm.ps1

      - name: Build native libraries and execute C and .NET interop
        run: ./Test-NativeInterop.ps1 -Target ${{ matrix.target }}
