name: Rust

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/configuration-*.json'
      - 'tests/OpenBlade.Service.Tests/BatteryConfigurationStoreTests.cs'
      - 'src/OpenBlade.Service/BatteryConfigurationStore.cs'
      - 'src/OpenBlade.Service/ProfileStore.cs'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  # No base-branch filter: migration PRs can be stacked before reaching main.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/configuration-*.json'
      - 'tests/OpenBlade.Service.Tests/BatteryConfigurationStoreTests.cs'
      - 'src/OpenBlade.Service/BatteryConfigurationStore.cs'
      - 'src/OpenBlade.Service/ProfileStore.cs'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    # This fixture-only stack has its own Windows check. In particular, its
    # hosted run must never enter the SCM smoke step in the full matrix.
    if: github.event_name != 'pull_request' || github.head_ref != 'test/rust-ntfs-admission' || github.base_ref != 'feat/rust-protected-storage' || github.event.pull_request.head.repo.full_name != github.repository
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install pinned toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Rustup reads the toolchain, profile and components from the TOML file.
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains 'host: ${{ matrix.target }}') {
            throw 'The runner must execute the selected target natively.'
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check workspace boundaries
        run: ./Check-Workspace.ps1

      - name: Test workspace guard
        run: ./Test-WorkspaceCheck.ps1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Verify unsupported transport output
        if: runner.os != 'Windows'
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'openblade-status-unsupported.txt'
          $output = & "./target/${{ matrix.target }}/debug/openblade-status-cli" 2> $diagnostic
          $code = $LASTEXITCODE
          if ($code -ne 1 -or $output) { throw 'Unsupported transport invented a successful status.' }
          if ((Get-Content $diagnostic -Raw).Trim() -cne 'OpenBlade status: unsupported transport (Windows named pipe required)') {
            throw 'Unsupported transport diagnostic changed.'
          }
          exit 0

      - name: Test workspace and all 43 canonical report and profile cases
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test the macOS discovery pilot
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Smoke the macOS discovery CLI
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $binary = '../tools/openblade-discovery/target/${{ matrix.target }}/debug/openblade-discovery'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one discovery snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'macos' -or
              $snapshot.hostMetadata -cne 'unverified' -or -not $snapshot.Contains('exactModel') -or
              $null -ne $snapshot.exactModel -or
              $snapshot.hid.state -cnotin @('none', 'single', 'ambiguous', 'incomplete')) {
            throw 'Invalid discovery snapshot or unavailable hosted macOS metadata APIs.'
          }

      - name: Verify the isolated Windows Rust service host
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $env:OPENBLADE_RUST_DEV_HOST_EXE = (Resolve-Path '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-host.exe').Path
          dotnet restore ../src/OpenBlade.Tray/OpenBlade.Tray.csproj
          dotnet test ../tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj --filter FullyQualifiedName~RustReadOnlyHostTests

      - name: Verify the Windows configuration writer against the managed store
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          $messages = cargo test --locked --lib --no-run --message-format=json --manifest-path $manifest --target ${{ matrix.target }}
          $testBinaries = @($messages | ConvertFrom-Json | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.profile.test -and
              $_.target.name -eq 'openblade_windows_host' -and $_.executable
          })
          if ($testBinaries.Count -ne 1) { throw 'Expected one Rust library test executable.' }
          $env:OPENBLADE_RUST_CONFIG_TEST_EXE = $testBinaries[0].executable
          $results = Join-Path $env:RUNNER_TEMP 'configuration-writer'
          $filter = 'FullyQualifiedName~WindowsReplay_ConfigurationAggregateFixtureMatchesManagedWriter|FullyQualifiedName~WindowsReplay_RustConfigurationWriterExchangesManagedBytes'
          dotnet test ../tests/OpenBlade.Service.Tests/OpenBlade.Service.Tests.csproj --filter $filter --results-directory $results --logger 'trx;LogFileName=oracle.trx'
          [xml]$trx = Get-Content (Join-Path $results 'oracle.trx') -Raw
          $exchange = @($trx.TestRun.Results.UnitTestResult | Where-Object {
            $_.testName -like '*.WindowsReplay_RustConfigurationWriterExchangesManagedBytes' -and $_.outcome -eq 'Passed'
          })
          if ($exchange.Count -ne 1) { throw 'The Rust and managed byte exchange did not pass.' }

      - name: Smoke Windows discovery metadata on the hosted VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-discovery.exe'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one Windows metadata snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'unsupported' -or
              $snapshot.registryMatch.state -cnotin @('unknown', 'incomplete') -or
              $snapshot.hid.inventory -cnotin @('complete', 'incomplete') -or
              $snapshot.hid.candidates -cne 'notEvaluated' -or $null -ne $snapshot.hid.counts) {
            throw "Unexpected hosted Windows discovery result: $output"
          }
          Write-Output $output

      - name: Smoke native SCM lifecycle on the hosted Windows VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: ../tools/openblade-windows-host/Test-HostedScm.ps1

      - name: Build native libraries and execute C and .NET interop
        run: ./Test-NativeInterop.ps1 -Target ${{ matrix.target }}

  protected-storage:
    name: Hosted NTFS protected storage
    if: github.event_name == 'pull_request' && github.head_ref == 'test/rust-ntfs-admission' && github.base_ref == 'feat/rust-protected-storage' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Verify real Administrator admission and transactional replacement
        env:
          OPENBLADE_PROTECTED_STORAGE_BASE: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        working-directory: rust
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:OPENBLADE_PROTECTED_STORAGE_BASE -cne '1ab52f12eb1165d86c76fc35d6d0fb5aee948644') {
            throw 'The reviewed protected storage base changed.'
          }
          # Any broader change must use the ordinary Rust matrix.
          $allowed = @(
            '.github/workflows/rust.yml'
            '.trail/learnings/2026-11-10-exercise-protected-storage-on-disposable-ntfs-jack.md'
            'tools/openblade-windows-host/src/configuration_writer.rs'
            'tools/openblade-windows-host/src/configuration_writer/fixture.rs'
            'tools/openblade-windows-host/src/configuration_writer/protected.rs'
            'tools/openblade-windows-host/src/configuration_writer/protected/tests.rs'
            'tools/openblade-windows-host/src/configuration_writer/protected/tests/hosted.rs'
          )
          $changes = @(git diff --name-only --no-renames $env:OPENBLADE_PROTECTED_STORAGE_BASE HEAD --)
          if ($changes.Count -eq 0 -or ($changes | Where-Object { $_ -cnotin $allowed })) {
            throw 'Use ordinary Rust CI for changes outside the focused NTFS test scope.'
          }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'This check requires a disposable GitHub-hosted runner.'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if ($identity.IsSystem -or -not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'An enabled Administrators token is required for the Administrator case.'
            }
          }
          finally {
            $identity.Dispose()
          }

          # The checked-in Setup factory defines the descriptor used by #912.
          # Compile the factory in-process and use only its in-memory output.
          $usings = 'using System; using System.Collections.Generic; using System.IO; using System.Linq; using System.Threading; using System.Threading.Tasks;'
          $setup = Get-Content ../src/OpenBlade.Setup/MachineDataDirectorySecurity.cs -Raw
          Add-Type -TypeDefinition "$usings`n$setup"
          $factory = [OpenBlade.Setup.WindowsMachineDataDirectorySecurity].GetMethod(
            'CreateProtectedSecurity', [Reflection.BindingFlags]'Static, NonPublic')
          $descriptor = $factory.Invoke($null, $null)
          $sections = [Security.AccessControl.AccessControlSections]'Owner, Access'
          $env:OPENBLADE_HOSTED_SETUP_SDDL = $descriptor.GetSecurityDescriptorSddlForm($sections)
          $env:OPENBLADE_HOSTED_NTFS_ADMIN = '1'
          rustup toolchain install --no-self-update
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --lib --manifest-path $manifest configuration_writer
          cargo clippy --locked --manifest-path $manifest --lib --tests -- -D warnings
          $test = 'configuration_writer::protected::tests::hosted::hosted_ntfs_admits_managed_configuration'
          cargo test --locked --lib --manifest-path $manifest $test -- --exact --ignored --nocapture |
            Tee-Object -Variable testOutput
          if (-not ($testOutput -match 'test result: ok\. 1 passed;') -or
              -not ($testOutput -match 'NTFS fixture removed')) {
            throw 'The hosted NTFS test or verified teardown did not run.'
          }
