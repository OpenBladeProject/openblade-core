name: Rust

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'src/OpenBlade.Deployment/WindowsNativePackage.cs'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Tray.Tests/RustSessionAgentTests.cs'
      - 'tests/OpenBlade.Tray.Tests/SessionDisplaySettingsAdapter.TestEndpoint.cs'
      - 'tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj'
      - 'src/OpenBlade.Tray/SessionDisplaySettingsAdapter.cs'
      - 'src/OpenBlade.Session/**'
      - 'src/OpenBlade.Display/DisplaySettingsModels.cs'
      - 'tests/OpenBlade.Session.Tests/**'
      - 'tests/OpenBlade.Service.Tests/ServiceControlRuntimeTests*.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/configuration-*.json'
      - 'tests/OpenBlade.Service.Tests/BatteryConfigurationStoreTests.cs'
      - 'src/OpenBlade.Service/BatteryConfigurationStore.cs'
      - 'src/OpenBlade.Service/ProfileStore.cs'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/BatteryOperationExecutor.cs'
      - 'src/OpenBlade.Service/BatteryOperationPlanner.cs'
      - 'src/OpenBlade.Service/ControlCoordinator.cs'
      - 'src/OpenBlade.Service/ConfirmedStateDriftTracker.cs'
      - 'src/OpenBlade.Service/ServiceControlRuntime.cs'
      - 'src/OpenBlade.Service/WriteConfirmationPolicy.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  # No base-branch filter: migration PRs can be stacked before reaching main.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'tools/openblade-discovery/**'
      - 'tools/openblade-windows-host/**'
      - 'src/OpenBlade.Deployment/WindowsNativePackage.cs'
      - 'evidence/legacy-captures/decoded/rz09-0581-pid-02e0-bios-3.01-adapter-power-readback-fixture.json'
      - 'src/OpenBlade.Tray.Core/ServiceClient.cs'
      - 'tests/OpenBlade.Tray.Tests/RustReadOnlyHostTests.cs'
      - 'tests/OpenBlade.Tray.Tests/RustSessionAgentTests.cs'
      - 'tests/OpenBlade.Tray.Tests/SessionDisplaySettingsAdapter.TestEndpoint.cs'
      - 'tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj'
      - 'src/OpenBlade.Tray/SessionDisplaySettingsAdapter.cs'
      - 'src/OpenBlade.Session/**'
      - 'src/OpenBlade.Display/DisplaySettingsModels.cs'
      - 'tests/OpenBlade.Session.Tests/**'
      - 'tests/OpenBlade.Service.Tests/ServiceControlRuntimeTests*.cs'
      - 'tests/OpenBlade.Contracts.Tests/WindowsReplay/v1/service*.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/service-runtime.json'
      - 'tests/OpenBlade.Service.Tests/WindowsReplay/v1/configuration-*.json'
      - 'tests/OpenBlade.Service.Tests/BatteryConfigurationStoreTests.cs'
      - 'src/OpenBlade.Service/BatteryConfigurationStore.cs'
      - 'src/OpenBlade.Service/ProfileStore.cs'
      - 'src/OpenBlade.Core.Native/**'
      - 'src/OpenBlade.Contracts/**'
      - 'src/OpenBlade.Service/ApplicationProfileResolution.cs'
      - 'src/OpenBlade.Service/ProfileAutomationState.cs'
      - 'src/OpenBlade.Service/BatteryOperationExecutor.cs'
      - 'src/OpenBlade.Service/BatteryOperationPlanner.cs'
      - 'src/OpenBlade.Service/ControlCoordinator.cs'
      - 'src/OpenBlade.Service/ConfirmedStateDriftTracker.cs'
      - 'src/OpenBlade.Service/ServiceControlRuntime.cs'
      - 'src/OpenBlade.Service/WriteConfirmationPolicy.cs'
      - 'src/OpenBlade.Service/OverrideResolver.cs'
      - 'src/OpenBlade.Protocol/**'
      - 'tests/OpenBlade.Protocol.Tests/**'
      - 'build/Build-NativeDevelopment.ps1'
      - 'build/NativePayload.ps1'
      - 'build/Prepare-NativeToolchain.ps1'
      - 'tests/OpenBlade.Core.Native.Tests/**'
      - 'tests/OpenBlade.Protocol.Tests/ParityFixtureTests.cs'
      - 'tests/OpenBlade.Testing/**'
      - 'OpenBlade.Native.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/rust.yml'
      - 'tests/Fixtures/Parity/**'
      - 'docs/rust-boundaries.md'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install pinned toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Rustup reads the toolchain, profile and components from the TOML file.
          rustup toolchain install --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version
          if ($version -notcontains 'host: ${{ matrix.target }}') {
            throw 'The runner must execute the selected target natively.'
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check workspace boundaries
        run: ./Check-Workspace.ps1

      - name: Test workspace guard
        run: ./Test-WorkspaceCheck.ps1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Verify unsupported transport output
        if: runner.os != 'Windows'
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP 'openblade-status-unsupported.txt'
          $output = & "./target/${{ matrix.target }}/debug/openblade-status-cli" 2> $diagnostic
          $code = $LASTEXITCODE
          if ($code -ne 1 -or $output) { throw 'Unsupported transport invented a successful status.' }
          if ((Get-Content $diagnostic -Raw).Trim() -cne 'OpenBlade status: unsupported transport (Windows named pipe required)') {
            throw 'Unsupported transport diagnostic changed.'
          }
          exit 0

      - name: Test workspace and all 43 canonical report and profile cases
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      # The workspace build leaves openblade-domain's optional features off;
      # they carry the history grammars that tools/openblade-windows-host enables.
      - name: Test and lint the domain thermal-history, profile-set, thermal-convergence and driver-mode-history features
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p openblade-domain --features thermal-history --target ${{ matrix.target }}
          cargo clippy --locked -p openblade-domain --features thermal-history --all-targets --target ${{ matrix.target }} -- -D warnings
          # The managed ProfileSet model, codec and validator, against the vectors
          # the managed Service tests record. Their stored-document digests need
          # thermal-history's SHA-256.
          cargo test --locked -p openblade-domain --features profile-set,thermal-history --target ${{ matrix.target }}
          cargo clippy --locked -p openblade-domain --features profile-set,thermal-history --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo clippy --locked -p openblade-domain --features profile-set --all-targets --target ${{ matrix.target }} -- -D warnings
          # The shared thermal convergence ledger, against the vectors the managed
          # Service tests record through the real ledger and state store.
          cargo test --locked -p openblade-domain --features thermal-convergence --target ${{ matrix.target }}
          cargo clippy --locked -p openblade-domain --features thermal-convergence,profile-set --all-targets --target ${{ matrix.target }} -- -D warnings
          # The native keyboard Driver-mode record codec against its shared vectors.
          cargo test --locked -p openblade-domain --features driver-mode-history --target ${{ matrix.target }}
          cargo clippy --locked -p openblade-domain --features driver-mode-history --all-targets --target ${{ matrix.target }} -- -D warnings

      # The workspace build leaves the production Session GPU close backend
      # off. Its tests drive scripted process seams only; none opens, signals
      # or closes a real process.
      - name: Test and lint the Windows Session GPU close backend
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($features in @('gpu-close', 'gpu-close,scripted-gpu-close')) {
            cargo test --locked -p openblade-platform-windows --features $features --target ${{ matrix.target }}
            cargo clippy --locked -p openblade-platform-windows --features $features --all-targets --target ${{ matrix.target }} -- -D warnings
          }

      - name: Test the macOS discovery pilot
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Smoke the macOS discovery CLI
        if: runner.os == 'macOS'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-discovery/Cargo.toml'
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $binary = '../tools/openblade-discovery/target/${{ matrix.target }}/debug/openblade-discovery'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one discovery snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'macos' -or
              $snapshot.hostMetadata -cne 'unverified' -or -not $snapshot.Contains('exactModel') -or
              $null -ne $snapshot.exactModel -or
              $snapshot.hid.state -cnotin @('none', 'single', 'ambiguous', 'incomplete')) {
            throw 'Invalid discovery snapshot or unavailable hosted macOS metadata APIs.'
          }

      - name: Verify the isolated Windows Rust service host
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          cargo fmt --all --check --manifest-path $manifest
          cargo test --locked --manifest-path $manifest --target ${{ matrix.target }}
          cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --all-targets -- -D warnings
          cargo build --locked --manifest-path $manifest --target ${{ matrix.target }}
          $env:OPENBLADE_RUST_DEV_HOST_EXE = (Resolve-Path '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-host.exe').Path
          dotnet restore ../src/OpenBlade.Tray/OpenBlade.Tray.csproj
          dotnet test ../tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj --filter FullyQualifiedName~RustReadOnlyHostTests
          dotnet test ../tests/OpenBlade.Service.Tests/OpenBlade.Service.Tests.csproj --filter 'FullyQualifiedName~RustBatteryParity|FullyQualifiedName~RustPerformanceParity|FullyQualifiedName~RustFanParity'
          dotnet test ../tests/OpenBlade.Protocol.Tests/OpenBlade.Protocol.Tests.csproj --filter FullyQualifiedName~RustFanParity

      # The default test run builds neither candidate. Run the shared-fixture
      # IPC decoder tests in the Service build that admits every request and
      # in an Agent build that reads Service status events and Display
      # requests and keeps the Display recovery checkpoint. The Session GPU
      # request, response and endpoint tests run in an Agent build that
      # serves GPU beside Display.
      - name: Test the candidates' object-only IPC decoders
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          $agent = @('openblade-windows-agent-candidate', 'agent-display-brightness-write-v1')
          # The GPU endpoint runs beside Display so the shared feature
          # lifetime is exercised with more than one feature.
          $gpu = @('openblade-windows-agent-candidate', 'agent-display-query-v1,agent-gpu-v1')
          # The application reporter lane selects the reporter alone, so no other
          # endpoint masks its wiring. The shared feature supervision with other
          # endpoints is only compiled and linted, by the combined check and lint
          # lanes below; no test runs the reporter beside another endpoint.
          $reporter = @('openblade-windows-agent-candidate', 'agent-application-reporter-v1')
          # The function-row lane selects the role alone for the same reason. Its
          # hook tests script the message loop and install no Windows hook.
          $functionRow = @('openblade-windows-agent-candidate', 'agent-function-row-v1')
          # Display automation alone. Its tests script the display and the
          # clock, including the managed parity vectors.
          $automation = @('openblade-windows-agent-candidate', 'agent-display-automation-v1')
          # The read-only keyboard Driver mode alone, and beside every Service
          # write it can publish through. The lanes without it pin that their
          # images send no 00/84 query and publish no Driver-mode member.
          $driverMode = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-read-v1')
          $driverModeProfiles = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-read-v1,service-profiles-v1')
          # The keyboard Driver-mode ownership alone, without the lifecycle
          # triggers lane that otherwise carries its serving-loop tick: the
          # owner step, its release budgets and the tick.
          $driverModeOwner = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1')
          # Beside the lifecycle triggers, whose tick takes the source lock again
          # after the keyboard step (`readiness.rs`); that path compiles only here.
          $driverModeOwnerTriggers = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1,service-profile-triggers-v1')
          # Thermal convergence, which implies the lifecycle triggers: the shared
          # ledger and its status, alone and beside the keyboard Driver-mode
          # owner, whose tick it shares.
          $convergence = @('openblade-windows-service-candidate', 'service-thermal-convergence-v1')
          $convergenceDriverMode = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1,service-thermal-convergence-v1')
          # The read-only live readings alone and beside every Service write.
          # The lanes without it pin that ObserveState still refuses them.
          $liveReadings = @('openblade-windows-service-candidate', 'service-live-readings-v1')
          $liveReadingsProfiles = @('openblade-windows-service-candidate', 'service-live-readings-v1,service-profiles-v1')
          # Beside the Driver-mode read, which shares the job, and beside a fan
          # write, which drops a retained fan pair.
          $liveReadingsDriverMode = @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-read-v1,service-live-readings-v1,service-profiles-v1')
          $liveReadingsFans = @('openblade-windows-service-candidate', 'service-live-readings-v1,service-fan-mutation-v2')
          # The read-only diagnostic export alone and beside the profile store,
          # its one history producer, the live readings and the lifecycle
          # triggers. The lanes without it pin that exportDiagnostics is
          # answered with managed's unsupported reply.
          $export = @('openblade-windows-service-candidate', 'service-diagnostics-export-v1')
          $exportProfiles = @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-profiles-v1')
          $exportLiveReadings = @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-live-readings-v1')
          $exportTriggers = @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-profile-triggers-v1')
          # Fan Stop served with its guardian unavailable, alone and beside the
          # lifecycle triggers, whose thermal policy projection carries its
          # status. The lanes without it pin the no-evidence status and record.
          $fanStop = @('openblade-windows-service-candidate', 'service-fan-stop-v1')
          $fanStopTriggers = @('openblade-windows-service-candidate', 'service-fan-stop-v1,service-profile-triggers-v1')
          # One run per filter, so a filter that matches no test fails the step.
          foreach ($run in @(
              @('openblade-windows-service-candidate', 'service-temporary-charge-v1', 'service_status::object_tests'),
              # Managed's unsupported reply in every Service lane: each one
              # pins a different row of the compiled `serves` table.
              @('openblade-windows-service-candidate', 'service-temporary-charge-v1', 'unserved'),
              @('openblade-windows-service-candidate', 'service-profiles-v1', 'unserved'),
              # Installed updateProfiles: the store transaction and the managed
              # vector corpus through the framed dispatcher.
              @('openblade-windows-service-candidate', 'service-profiles-v1', 'profiles::'),
              # Automatic reconciliation of saved intent: the request triggers.
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1', 'request_triggers'),
              # The lifecycle causes and their pacing.
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1', 'triggers::lifecycle::tests'),
              # The thermal control policy: its store, requests and the
              # convergence status member with the managed vector replays.
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1', 'convergence'),
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1', 'thermal_policy'),
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1', 'profiles::tests::policy::'),
              @('openblade-windows-service-candidate', 'service-fan-mutation-v2', 'unserved'),
              @('openblade-windows-service-candidate', 'service-thermal-mutation-v1', 'unserved'),
              @('openblade-windows-service-candidate', 'service-metadata-only-v1', 'unserved'),
              ($agent + 'service_status::object_tests'),
              ($agent + 'display_query::recovery'),
              ($agent + 'display_query::request_parity'),
              ($gpu + 'gpu::request_parity'),
              ($gpu + 'gpu::tests'),
              ($gpu + 'feature_lifetime'),
              ($gpu + 'native_endpoint_readiness'),
              ($reporter + 'session_native::application'),
              ($reporter + 'service_client::tests::report'),
              ($reporter + 'session_native::restart'),
              ($reporter + 'native_package'),
              ($reporter + 'feature_lifetime'),
              ($functionRow + 'session_native::function_row'),
              # The status subscription every Agent role shares, including its
              # missed-tick behavior after a suspend.
              ($functionRow + 'service_client::tests::subscription'),
              ($functionRow + 'native_package'),
              ($functionRow + 'feature_lifetime'),
              # Every display suite: automation shares the manual writes' gate,
              # recovery state and checkpoint, so each manual write runs here too.
              ($automation + 'display_query'),
              ($automation + 'native_package'),
              ($driverMode + 'driver_mode::tests'),
              ($driverMode + 'device_mode'),
              # The shared job body of every composition: bind, retirement and
              # the freshness filter.
              ($driverMode + 'job_tests'),
              ($driverMode + 'native_package'),
              ($driverModeProfiles + 'driver_mode::tests'),
              ($driverModeOwner + 'driver_mode'),
              ($driverModeOwner + 'device_mode'),
              # The low-power cleanup admission and its generation fence
              # (`mailbox_read::low_power_admission`).
              ($driverModeOwner + 'the_low_power_admission'),
              ($driverModeOwner + 'a_serving_loop_tick_runs_the_keyboard_driver_mode_step'),
              ($driverModeOwnerTriggers + 'driver_mode'),
              ($driverModeOwnerTriggers + 'a_serving_loop_tick_runs_the_keyboard_driver_mode_step'),
              ($convergence + 'convergence'),
              ($convergence + 'request_triggers'),
              # The explicit reapply's summaries.
              ($convergence + 'triggers::reapply'),
              ($convergence + 'native_package'),
              ($convergenceDriverMode + 'convergence'),
              ($convergenceDriverMode + 'a_serving_loop_tick_runs_the_keyboard_driver_mode_step'),
              # A temporary-charge cancel whose write port failed to open, and
              # the transaction pool pins of fan and temporary-charge writes.
              @('openblade-windows-service-candidate', 'service-temporary-charge-v1', 'tfc_release_a_cancel_whose_port'),
              @('openblade-windows-service-candidate', 'service-fan-mutation-v2', 'pool_pins'),
              # Owned Stop fan cleanup with fan mutation alone: the handback under
              # the Service cleanup admission with nobody signed in, and the pacing
              # before row 31.
              @('openblade-windows-service-candidate', 'service-fan-mutation-v2', 'fan_v2_owned_stop_cleanup'),
              # A composition without Driver-mode ownership refuses to open the
              # owner custody over its record, which it cannot honour.
              @('openblade-windows-service-candidate', 'service-fan-mutation-v2', 'driver_mode_record_absent'),
              ($liveReadings + 'live_readings::tests'),
              ($liveReadings + 'live_readings::windows::tests'),
              ($liveReadings + 'firmware_versions'),
              ($liveReadings + 'gpu_temperature'),
              ($liveReadings + 'fan_rpm'),
              ($liveReadings + 'mcu_version'),
              ($liveReadings + 'readiness::tests::observation'),
              ($liveReadings + 'native_package'),
              ($liveReadingsProfiles + 'live_readings::tests'),
              ($liveReadingsProfiles + 'firmware_versions'),
              ($liveReadingsProfiles + 'gpu_temperature'),
              ($liveReadingsDriverMode + 'live_readings::tests'),
              ($liveReadingsDriverMode + 'firmware_versions'),
              ($liveReadingsDriverMode + 'gpu_temperature'),
              ($liveReadingsDriverMode + 'fan_rpm'),
              ($liveReadingsDriverMode + 'mcu_version'),
              ($liveReadingsDriverMode + 'driver_mode::tests'),
              ($liveReadingsFans + 'live_readings::tests'),
              ($liveReadingsFans + 'firmware_versions'),
              ($liveReadingsFans + 'gpu_temperature'),
              ($liveReadingsFans + 'capability_tests'),
              ($export + 'diagnostic_export'),
              ($export + 'readiness::tests::export'),
              ($export + 'unserved'),
              ($export + 'native_package'),
              ($exportProfiles + 'diagnostic_export'),
              ($exportProfiles + 'readiness::tests::export'),
              ($exportProfiles + 'unserved'),
              ($exportProfiles + 'profiles::'),
              ($exportLiveReadings + 'readiness::tests::export'),
              ($exportLiveReadings + 'live_readings::tests'),
              ($exportTriggers + 'readiness::tests::export'),
              ($exportTriggers + 'request_triggers'),
              ($fanStop + 'fan_stop'),
              ($fanStop + 'unserved'),
              ($fanStop + 'native_package'),
              ($fanStop + 'profiles::'),
              ($fanStop + 'capability_tests'),
              ($fanStopTriggers + 'fan_stop'),
              ($fanStopTriggers + 'thermal_policy'),
              @('openblade-windows-service-candidate', 'service-mailbox-observation-v1', 'capability_tests'),
              @('openblade-windows-service-candidate', 'service-mailbox-observation-v1', 'readiness::tests::observation'),
              @('openblade-windows-service-candidate', 'service-mailbox-observation-v1', 'driver_mode_absent'),
              @('openblade-windows-service-candidate', 'service-profiles-v1', 'driver_mode_absent'),
              @('openblade-windows-service-candidate', 'service-temporary-charge-v1', 'job_tests'),
              @('openblade-windows-service-candidate', 'service-metadata-only-v1', 'service_status::object_tests'),
              @('openblade-windows-service-candidate', 'service-profiles-v1', 'device_mode'))) {
            # Capture the exit code instead of throwing, so the output is printed first.
            $PSNativeCommandUseErrorActionPreference = $false
            $output = cargo test --locked --manifest-path $manifest --target ${{ matrix.target }} --bin $run[0] --features $run[1] -- $run[2]
            $exit = $LASTEXITCODE
            $output
            if ($exit -ne 0) {
              throw "$($run[2]) failed in $($run[0]) (exit $exit)."
            }
            if (-not ($output -match '^test result: ok\. [1-9]')) {
              throw "No $($run[2]) tests ran in $($run[0])."
            }
          }

      # Tests compile the installed Agent's endpoints but not its monitor
      # wiring, which only a non-test build selects. Check that build with
      # the GPU endpoint alone and beside Battery and every Display write.
      - name: Check the installed Agent builds that serve GPU
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          foreach ($features in @('agent-gpu-v1', 'agent-application-reporter-v1', 'agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1', 'agent-function-row-v1', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1,agent-function-row-v1', 'agent-display-automation-v1', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1,agent-function-row-v1,agent-display-automation-v1')) {
            cargo check --locked --manifest-path $manifest --target ${{ matrix.target }} --bin openblade-windows-agent-candidate --features $features
          }

      # The default Clippy steps skip the code each candidate feature lane adds.
      - name: Lint the candidate feature lanes
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          foreach ($lane in @(
              @('openblade-windows-service-candidate', 'service-thermal-mutation-v1'),
              @('openblade-windows-service-candidate', 'service-fan-mutation-v2'),
              @('openblade-windows-service-candidate', 'service-battery-policy-v1'),
              @('openblade-windows-service-candidate', 'service-temporary-charge-v1'),
              @('openblade-windows-service-candidate', 'service-profiles-v1'),
              # The read-only observation lane alone carries older unused-code
              # warnings, so the Driver-mode read is linted beside every write.
              @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-read-v1,service-profiles-v1'),
              # The live readings for the same reason, also beside the Driver-mode read.
              @('openblade-windows-service-candidate', 'service-live-readings-v1,service-profiles-v1'),
              @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-read-v1,service-live-readings-v1,service-profiles-v1'),
              @('openblade-windows-service-candidate', 'service-live-readings-v1,service-fan-mutation-v2'),
              # The diagnostic export for the same reason, beside each write
              # and read it composes with.
              @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-profiles-v1'),
              @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-live-readings-v1,service-profiles-v1'),
              @('openblade-windows-service-candidate', 'service-diagnostics-export-v1,service-profile-triggers-v1'),
              @('openblade-windows-service-candidate', 'service-profile-triggers-v1'),
              @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1'),
              @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1,service-profile-triggers-v1'),
              @('openblade-windows-service-candidate', 'service-thermal-convergence-v1'),
              @('openblade-windows-service-candidate', 'service-fan-stop-v1'),
              @('openblade-windows-service-candidate', 'service-fan-stop-v1,service-profile-triggers-v1'),
              @('openblade-windows-service-candidate', 'service-keyboard-driver-mode-v1,service-thermal-convergence-v1'),
              @('openblade-windows-agent-candidate', 'agent-display-brightness-write-v1'),
              @('openblade-windows-agent-candidate', 'agent-display-profile-apply-v1'),
              @('openblade-windows-agent-candidate', 'agent-battery-report-v1'),
              @('openblade-windows-agent-candidate', 'agent-gpu-v1'),
              @('openblade-windows-agent-candidate', 'agent-application-reporter-v1'),
              @('openblade-windows-agent-candidate', 'agent-display-query-v1,agent-gpu-v1'),
              @('openblade-windows-agent-candidate', 'agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1'),
              @('openblade-windows-agent-candidate', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1'),
              @('openblade-windows-agent-candidate', 'agent-function-row-v1'),
              @('openblade-windows-agent-candidate', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1,agent-function-row-v1'),
              @('openblade-windows-agent-candidate', 'agent-display-automation-v1'),
              @('openblade-windows-agent-candidate', 'agent-application-reporter-v1,agent-gpu-v1,agent-battery-report-v1,agent-display-profile-apply-v1,agent-function-row-v1,agent-display-automation-v1'))) {
            cargo clippy --locked --manifest-path $manifest --target ${{ matrix.target }} --bin $lane[0] --features $lane[1] --all-targets -- -D warnings
          }

      - name: Verify the Windows configuration writer against the managed store
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $manifest = '../tools/openblade-windows-host/Cargo.toml'
          $messages = cargo test --locked --lib --no-run --message-format=json --manifest-path $manifest --target ${{ matrix.target }}
          $testBinaries = @($messages | ConvertFrom-Json | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.profile.test -and
              $_.target.name -eq 'openblade_windows_host' -and $_.executable
          })
          if ($testBinaries.Count -ne 1) { throw 'Expected one Rust library test executable.' }
          $env:OPENBLADE_RUST_CONFIG_TEST_EXE = $testBinaries[0].executable
          $results = Join-Path $env:RUNNER_TEMP 'configuration-writer'
          $filter = 'FullyQualifiedName~WindowsReplay_ConfigurationAggregateFixtureMatchesManagedWriter|FullyQualifiedName~WindowsReplay_RustConfigurationWriterExchangesManagedBytes|FullyQualifiedName~WindowsReplay_ProfileFixtureMatchesManagedMigration'
          dotnet test ../tests/OpenBlade.Service.Tests/OpenBlade.Service.Tests.csproj --filter $filter --results-directory $results --logger 'trx;LogFileName=oracle.trx'
          [xml]$trx = Get-Content (Join-Path $results 'oracle.trx') -Raw
          $exchange = @($trx.TestRun.Results.UnitTestResult | Where-Object {
            $_.testName -like '*.WindowsReplay_RustConfigurationWriterExchangesManagedBytes' -and $_.outcome -eq 'Passed'
          })
          if ($exchange.Count -ne 1) { throw 'The Rust and managed byte exchange did not pass.' }

      - name: Verify the current-user Windows Rust Session Agent
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:OPENBLADE_RUST_SESSION_AGENT_EXE = (Resolve-Path '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-rust-session-agent.exe').Path
          dotnet test ../tests/OpenBlade.Session.Tests/OpenBlade.Session.Tests.csproj --filter FullyQualifiedName~WindowsReplaySessionTests
          dotnet test ../tests/OpenBlade.Tray.Tests/OpenBlade.Tray.Tests.csproj --filter FullyQualifiedName~RustSessionAgentTests

      - name: Smoke Windows discovery metadata on the hosted VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = '../tools/openblade-windows-host/target/${{ matrix.target }}/debug/openblade-windows-discovery.exe'
          $output = & $binary
          if (@($output).Count -ne 1) { throw 'Expected one Windows metadata snapshot.' }
          $snapshot = $output | ConvertFrom-Json -AsHashtable
          if ($snapshot.schemaVersion -ne 1 -or $snapshot.platform -cne 'unsupported' -or
              $snapshot.registryMatch.state -cnotin @('unknown', 'incomplete') -or
              $snapshot.hid.inventory -cnotin @('complete', 'incomplete') -or
              $snapshot.hid.candidates -cne 'notEvaluated' -or $null -ne $snapshot.hid.counts) {
            throw "Unexpected hosted Windows discovery result: $output"
          }
          Write-Output $output

      - name: Smoke native SCM lifecycle on the hosted Windows VM
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: ../tools/openblade-windows-host/Test-HostedScm.ps1

      - name: Build native libraries and execute C and .NET interop
        run: ./Test-NativeInterop.ps1 -Target ${{ matrix.target }}
