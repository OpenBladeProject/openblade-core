name: Build and validate

on:
  workflow_call:
    inputs:
      channel:
        description: Stable or Nightly build identity.
        required: true
        type: string
      build-revision:
        description: Ordered fourth version component for Nightly builds.
        required: false
        default: 0
        type: number
      validation-mode:
        description: Full, affected, or none.
        required: false
        default: full
        type: string
      validation-plan-json:
        description: Validated affected-project plan emitted by the CI classifier.
        required: false
        default: '{}'
        type: string
      run-quality:
        description: Run .NET formatting, builds, and tests.
        required: false
        default: true
        type: boolean
      run-contracts:
        description: Run PowerShell build-contract suites.
        required: false
        default: true
        type: boolean
      run-component-publish:
        description: Publish only affected executable components.
        required: false
        default: false
        type: boolean
      run-installer:
        description: Run the complete production installer validation lane.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate-request:
    name: Validate build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        shell: pwsh
        env:
          OPENBLADE_BUILD_CHANNEL: ${{ inputs.channel }}
          OPENBLADE_BUILD_REVISION: ${{ inputs.build-revision }}
          OPENBLADE_VALIDATION_MODE: ${{ inputs.validation-mode }}
          OPENBLADE_VALIDATION_PLAN_JSON: ${{ inputs.validation-plan-json }}
          OPENBLADE_RUN_QUALITY: ${{ inputs.run-quality }}
          OPENBLADE_RUN_CONTRACTS: ${{ inputs.run-contracts }}
          OPENBLADE_RUN_COMPONENT_PUBLISH: ${{ inputs.run-component-publish }}
          OPENBLADE_RUN_INSTALLER: ${{ inputs.run-installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENBLADE_BUILD_CHANNEL -notin @('Stable', 'Nightly')) {
            throw "Unsupported build channel '$env:OPENBLADE_BUILD_CHANNEL'."
          }
          $revision = 0
          if (-not [int]::TryParse(
              $env:OPENBLADE_BUILD_REVISION,
              [ref]$revision)) {
            throw 'The build revision is not an integer.'
          }
          if ($env:OPENBLADE_BUILD_CHANNEL -eq 'Stable' -and $revision -ne 0) {
            throw 'Stable builds must use revision zero.'
          }
          if ($env:OPENBLADE_BUILD_CHANNEL -eq 'Nightly' -and
              ($revision -lt 1 -or $revision -gt 65535)) {
            throw 'Nightly build revisions must be between 1 and 65535.'
          }
          if ($env:OPENBLADE_VALIDATION_MODE -notin @('full', 'affected', 'none')) {
            throw "Unsupported validation mode '$env:OPENBLADE_VALIDATION_MODE'."
          }
          if ($env:OPENBLADE_RUN_COMPONENT_PUBLISH -eq 'true' -and
              $env:OPENBLADE_RUN_INSTALLER -eq 'true') {
            throw 'Component and complete installer publication must not run together.'
          }
          if ($env:OPENBLADE_VALIDATION_MODE -eq 'full' -and
              ($env:OPENBLADE_RUN_QUALITY -ne 'true' -or
               $env:OPENBLADE_RUN_CONTRACTS -ne 'true' -or
               $env:OPENBLADE_RUN_COMPONENT_PUBLISH -ne 'false' -or
               $env:OPENBLADE_RUN_INSTALLER -ne 'true')) {
            throw 'Full validation requires exhaustive lanes.'
          }
          if ($env:OPENBLADE_VALIDATION_MODE -eq 'none' -and
              ($env:OPENBLADE_RUN_QUALITY -ne 'false' -or
               $env:OPENBLADE_RUN_CONTRACTS -ne 'false' -or
               $env:OPENBLADE_RUN_COMPONENT_PUBLISH -ne 'false' -or
               $env:OPENBLADE_RUN_INSTALLER -ne 'false')) {
            throw 'Validation mode none cannot enable an execution lane.'
          }
          if ($env:OPENBLADE_VALIDATION_MODE -eq 'affected') {
            $plan = $env:OPENBLADE_VALIDATION_PLAN_JSON | ConvertFrom-Json
            if ($plan.mode -ne 'affected') {
              throw 'The affected validation plan mode does not match the request.'
            }
            $expectedInputs = [ordered]@{
              OPENBLADE_RUN_QUALITY = @($plan.QualityProjects).Count -gt 0
              OPENBLADE_RUN_CONTRACTS = @($plan.ContractTests).Count -gt 0
              OPENBLADE_RUN_COMPONENT_PUBLISH =
                @($plan.PublishProjects).Count -gt 0 -and -not [bool]$plan.RunInstaller
              OPENBLADE_RUN_INSTALLER = [bool]$plan.RunInstaller
            }
            foreach ($expectedInput in $expectedInputs.GetEnumerator()) {
              $actual = [Environment]::GetEnvironmentVariable($expectedInput.Key)
              $expected = $expectedInput.Value.ToString().ToLowerInvariant()
              if ($actual -ne $expected) {
                throw "$($expectedInput.Key) must be '$expected' for the affected plan."
              }
            }
          }

  quality-and-tests:
    name: Quality and tests (${{ matrix.shard }})
    needs: validate-request
    if: ${{ inputs.run-quality }}
    runs-on: windows-latest
    timeout-minutes: 45
    # Full validation runs formatting, the solution build and tests, and the
    # Capture tests (about half of all test time) on parallel runners.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.validation-mode == 'full' && '["format","solution","capture"]' || '["affected"]') }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      OPENBLADE_SKIP_INTERACTIVE_DESKTOP_TESTS: 0
      OPENBLADE_CAPTURE_TESTS_PROJECT: tests\OpenBlade.Capture.Tests\OpenBlade.Capture.Tests.csproj
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up fixture Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache locked native fixture dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-native-fixtures-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock', 'tools/openblade-windows-host/Cargo.lock') }}

      - name: Prepare pinned native build toolchain
        shell: powershell
        run: ./build/Prepare-NativeToolchain.ps1

      - name: Prepare locked Windows fixture dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The fixture runner is offline. Populate the separate development
          # workspace's locked dependency cache here, using the installed pin.
          $pin = [regex]::Match((Get-Content rust/rust-toolchain.toml -Raw),
            '(?m)^channel = "([0-9.]+)"$').Groups[1].Value
          if (-not $pin) { throw 'Missing exact Rust toolchain pin.' }
          cargo "+$pin" fetch --locked --manifest-path tools/openblade-windows-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Locked Windows fixture inputs could not be fetched.' }

      - name: Restore
        if: matrix.shard == 'format' || matrix.shard == 'solution'
        run: dotnet restore OpenBlade.slnx -p:NuGetAudit=false

      - name: Verify formatting
        if: matrix.shard == 'format'
        run: >-
          dotnet format OpenBlade.slnx
          --verify-no-changes
          --no-restore
          --severity error
          --verbosity minimal

      - name: Build
        if: matrix.shard == 'solution'
        run: >-
          dotnet build OpenBlade.slnx
          -p:NuGetAudit=false
          --no-restore
          -m:1
          --verbosity minimal

      - name: Restore and build Capture tests
        if: matrix.shard == 'capture'
        run: |
          dotnet restore $env:OPENBLADE_CAPTURE_TESTS_PROJECT -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Capture test restore failed.' }
          dotnet build $env:OPENBLADE_CAPTURE_TESTS_PROJECT -p:NuGetAudit=false --no-restore -m:1 --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Capture test build failed.' }

      - name: Prepare test temporary storage
        if: matrix.shard != 'format'
        shell: pwsh
        run: |
          # Guardian fixtures keep the real write-through journal. Use the
          # runner's job storage instead of the Windows user-profile temp disk.
          $ErrorActionPreference = 'Stop'
          $testTemp = Join-Path $env:RUNNER_TEMP 'openblade-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          foreach ($root in @([IO.Path]::GetTempPath(), $testTemp)) {
            $path = Join-Path $root ('openblade-flush-' + [Guid]::NewGuid().ToString('N') + '.tmp')
            $stream = $null
            try {
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::CreateNew,
                [IO.FileAccess]::Write, [IO.FileShare]::None, 4096, [IO.FileOptions]::WriteThrough)
              $buffer = [byte[]]::new(4096)
              $timer = [Diagnostics.Stopwatch]::StartNew()
              for ($i = 0; $i -lt 32; $i++) {
                $stream.Write($buffer, 0, $buffer.Length)
                $stream.Flush($true)
              }
              $timer.Stop()
              Write-Host "Journal storage: root=$root; records=32; elapsedMs=$($timer.ElapsedMilliseconds)"
            } finally {
              if ($null -ne $stream) { $stream.Dispose() }
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
            }
          }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV

      - name: Run native interop tests
        if: matrix.shard == 'solution'
        shell: pwsh
        run: ./rust/Test-NativeInterop.ps1

      # Every Capture test lives in the OpenBlade.Capture.Tests namespace and
      # runs in the capture shard instead.
      - name: Test
        if: matrix.shard == 'solution'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./build/NativeWindowsFixtures.ps1
          Invoke-OpenBladeNativeFixtureScope -Repository $PWD.Path -Configuration Debug -OutputRoot (Join-Path $env:RUNNER_TEMP 'openblade-native-fixtures') -Action {
            dotnet test OpenBlade.slnx -p:NuGetAudit=false --no-build --no-restore -m:1 --verbosity minimal --filter "FullyQualifiedName!~OpenBlade.Capture.Tests."
            if ($LASTEXITCODE -ne 0) { throw "Solution tests failed with exit code $LASTEXITCODE." }
          }

      - name: Test Capture
        if: matrix.shard == 'capture'
        run: >-
          dotnet test $env:OPENBLADE_CAPTURE_TESTS_PROJECT
          -p:NuGetAudit=false
          --no-build
          --no-restore
          --verbosity minimal

      - name: Run affected quality and tests
        if: matrix.shard == 'affected'
        shell: pwsh
        env:
          OPENBLADE_VALIDATION_PLAN_JSON: ${{ inputs.validation-plan-json }}
        run: >-
          .\build\Run-AffectedCi.ps1
          -Lane Quality
          -PlanJson $env:OPENBLADE_VALIDATION_PLAN_JSON

      - name: Retain native fixture receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-fixtures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/openblade-native-fixtures/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Verify native failure stops the production actor
        if: matrix.shard == 'solution' || matrix.shard == 'affected'
        shell: powershell
        run: ./rust/Test-ProductionActivation.ps1

  build-contracts:
    name: Build contracts (${{ matrix.shard }})
    needs: validate-request
    if: ${{ inputs.run-contracts }}
    runs-on: windows-latest
    timeout-minutes: 45
    # Each translator package export renders every screenshot for about seven
    # minutes, so full validation runs the two determinism comparisons on their
    # own runners beside the remaining contract suites.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.validation-mode == 'full' && '["general","translator-same-process","translator-fresh-process"]' || '["affected"]') }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up fixture Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned native build toolchain
        shell: powershell
        run: ./build/Prepare-NativeToolchain.ps1

      - name: Restore
        if: matrix.shard != 'affected'
        run: |
          dotnet restore OpenBlade.slnx -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
          dotnet restore .\src\OpenBlade.Tray\OpenBlade.Tray.csproj -p:NuGetAudit=false -p:OpenBladeLocalizationPreview=true
          if ($LASTEXITCODE -ne 0) { throw 'Localization preview restore failed.' }
          dotnet restore .\build\installer\OpenBlade.Installer.UI.Tests\OpenBlade.Installer.UI.Tests.csproj -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Installer snapshot test restore failed.' }

      # This lane intentionally does not build the solution first. Contract
      # scripts inspect source or produce their own isolated build outputs;
      # tests that consume shared bin/obj output belong in quality-and-tests.
      - name: Run build contracts
        if: matrix.shard == 'general'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $translator = 'LocalizationTranslatorWorkflow.Tests.ps1'
          Get-ChildItem .\tests\Build.Tests\*.Tests.ps1 |
            Where-Object Name -ne $translator |
            Sort-Object Name |
            ForEach-Object { & $_.FullName }
          & (Join-Path .\tests\Build.Tests $translator) -Part Workbook

      - name: Run translator same-process package contract
        if: matrix.shard == 'translator-same-process'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Build.Tests\LocalizationTranslatorWorkflow.Tests.ps1 -Part SameProcessPackage

      - name: Run translator fresh-process package contract
        if: matrix.shard == 'translator-fresh-process'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Build.Tests\LocalizationTranslatorWorkflow.Tests.ps1 -Part FreshProcessPackage

      - name: Run affected build contracts
        if: matrix.shard == 'affected'
        shell: powershell
        env:
          OPENBLADE_VALIDATION_PLAN_JSON: ${{ inputs.validation-plan-json }}
        run: >-
          .\build\Run-AffectedCi.ps1
          -Lane Contracts
          -PlanJson $env:OPENBLADE_VALIDATION_PLAN_JSON

      - name: Retain localization workflow failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: translator-archive-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: artifacts/translator-archive-failures/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  component-publish:
    name: Component publish
    needs: validate-request
    if: ${{ inputs.run-component-publish }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned native build toolchain
        shell: powershell
        run: ./build/Prepare-NativeToolchain.ps1

      - name: Publish affected components
        shell: powershell
        env:
          OPENBLADE_VALIDATION_PLAN_JSON: ${{ inputs.validation-plan-json }}
        run: >-
          .\build\Run-AffectedCi.ps1
          -Lane Publish
          -PlanJson $env:OPENBLADE_VALIDATION_PLAN_JSON
          -Configuration Release

  installer-validation:
    name: Installer validation
    needs: validate-request
    if: ${{ inputs.run-installer }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned native build toolchain
        shell: powershell
        run: ./build/Prepare-NativeToolchain.ps1

      # CI does not upload Stable installers, so it skips the Store readiness
      # report. Release publication and Nightly builds still produce it.
      - name: Publish and validate production installer
        if: inputs.channel == 'Stable'
        shell: powershell
        run: .\build\Publish.ps1 -Configuration Release -SkipStoreReadiness

      - name: Publish and validate nightly installer
        if: inputs.channel == 'Nightly'
        shell: powershell
        run: >-
          .\build\Publish.ps1
          -Configuration Release
          -BuildChannel Nightly
          -BuildRevision ${{ inputs.build-revision }}
          -SourceRevision '${{ github.sha }}'
          -WorkflowRunId '${{ github.run_id }}.${{ github.run_attempt }}'

      - name: Upload nightly installer
        if: inputs.channel == 'Nightly'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            OpenBlade-nightly-${{ inputs.build-revision }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/win-x64/OpenBlade-Setup.exe
            artifacts/win-x64/OpenBlade-Setup.exe.sha256
            artifacts/win-x64/OpenBlade-Nightly.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-and-test:
    needs:
      - validate-request
      - quality-and-tests
      - build-contracts
      - component-publish
      - installer-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gate script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Verify required validation lanes
        shell: pwsh
        env:
          OPENBLADE_VALIDATE_RESULT: ${{ needs.validate-request.result }}
          OPENBLADE_QUALITY_RESULT: ${{ needs.quality-and-tests.result }}
          OPENBLADE_CONTRACT_RESULT: ${{ needs.build-contracts.result }}
          OPENBLADE_COMPONENT_PUBLISH_RESULT: ${{ needs.component-publish.result }}
          OPENBLADE_INSTALLER_RESULT: ${{ needs.installer-validation.result }}
          OPENBLADE_RUN_QUALITY: ${{ inputs.run-quality }}
          OPENBLADE_RUN_CONTRACTS: ${{ inputs.run-contracts }}
          OPENBLADE_RUN_COMPONENT_PUBLISH: ${{ inputs.run-component-publish }}
          OPENBLADE_RUN_INSTALLER: ${{ inputs.run-installer }}
        run: |
          ./build/Assert-CiLaneResults.ps1 `
            -ValidateResult $env:OPENBLADE_VALIDATE_RESULT `
            -QualityResult $env:OPENBLADE_QUALITY_RESULT `
            -ContractResult $env:OPENBLADE_CONTRACT_RESULT `
            -ComponentPublishResult $env:OPENBLADE_COMPONENT_PUBLISH_RESULT `
            -InstallerResult $env:OPENBLADE_INSTALLER_RESULT `
            -RunQuality $env:OPENBLADE_RUN_QUALITY `
            -RunContracts $env:OPENBLADE_RUN_CONTRACTS `
            -RunComponentPublish $env:OPENBLADE_RUN_COMPONENT_PUBLISH `
            -RunInstaller $env:OPENBLADE_RUN_INSTALLER
