name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      requires-build: ${{ steps.scope.outputs.requires-build }}
      requires-installer: ${{ steps.scope.outputs.requires-installer }}
    steps:
      - name: Check out source metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Determine whether the full build is required
        id: scope
        shell: pwsh
        env:
          OPENBLADE_EVENT_NAME: ${{ github.event_name }}
          OPENBLADE_BEFORE_SHA: ${{ github.event.before }}
          OPENBLADE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENBLADE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENBLADE_PR_BODY: ${{ github.event.pull_request.body }}
          OPENBLADE_CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./build/CiBuildScope.ps1

          $forceBuild = $env:OPENBLADE_EVENT_NAME -eq 'workflow_dispatch'
          $changedPaths = @()
          if (-not $forceBuild) {
            if ($env:OPENBLADE_EVENT_NAME -eq 'pull_request') {
              $baseSha = $env:OPENBLADE_BASE_SHA
              $headSha = $env:OPENBLADE_HEAD_SHA
            }
            else {
              $baseSha = $env:OPENBLADE_BEFORE_SHA
              $headSha = $env:OPENBLADE_CURRENT_SHA
            }

            if ([string]::IsNullOrWhiteSpace($baseSha) -or
                [string]::IsNullOrWhiteSpace($headSha) -or
                $baseSha -match '^0{40}$') {
              if ($env:OPENBLADE_EVENT_NAME -eq 'pull_request') {
                throw 'Pull request version validation requires base and head commits.'
              }
              $forceBuild = $true
            }
            else {
              if ($env:OPENBLADE_EVENT_NAME -eq 'pull_request') {
                . ./build/PullRequestVersion.ps1
                $baseProperties = @(git show "${baseSha}:Directory.Build.props")
                if ($LASTEXITCODE -ne 0) {
                  throw 'Unable to read Directory.Build.props from the pull request base.'
                }
                $headProperties = @(git show "${headSha}:Directory.Build.props")
                if ($LASTEXITCODE -ne 0) {
                  throw 'Unable to read Directory.Build.props from the pull request head.'
                }
                $baseVersion = Get-OpenBladeVersionFromBuildProperties `
                  -Content ($baseProperties -join "`n") `
                  -Source 'The pull request base Directory.Build.props'
                $headVersion = Get-OpenBladeVersionFromBuildProperties `
                  -Content ($headProperties -join "`n") `
                  -Source 'The pull request head Directory.Build.props'
                $versionResult = Assert-OpenBladePullRequestVersion `
                  -BaseVersion $baseVersion `
                  -HeadVersion $headVersion `
                  -Body $env:OPENBLADE_PR_BODY
                Write-Host (
                  "Version policy passed: $($versionResult.Impact), " +
                  "$($versionResult.VersionChange).")
              }

              $changedPaths = @(
                git diff --name-only --no-renames $baseSha $headSha --)
              if ($LASTEXITCODE -ne 0) {
                throw 'Unable to determine the changed paths.'
              }
            }
          }

          $requiresBuild = Test-OpenBladeCiBuildRequired `
            -ChangedPath $changedPaths `
            -Force:$forceBuild
          $requiresInstaller = Test-OpenBladeCiInstallerRequired `
            -ChangedPath $changedPaths `
            -Force:$forceBuild
          "requires-build=$($requiresBuild.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "requires-installer=$($requiresInstaller.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build-and-test:
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.requires-build == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      channel: Stable
      run-installer: ${{ needs.classify-changes.outputs.requires-installer == 'true' }}
    permissions:
      contents: read
