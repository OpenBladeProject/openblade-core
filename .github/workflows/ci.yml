name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenBlade.slnx -p:NuGetAudit=false

      - name: Verify formatting
        run: >-
          dotnet format OpenBlade.slnx
          --verify-no-changes
          --no-restore
          --severity error
          --verbosity minimal

      - name: Build
        run: >-
          dotnet build OpenBlade.slnx
          -p:NuGetAudit=false
          --no-restore
          -m:1
          --verbosity minimal

      - name: Test
        run: >-
          dotnet test OpenBlade.slnx
          -p:NuGetAudit=false
          --no-build
          --no-restore
          -m:1
          --verbosity minimal
