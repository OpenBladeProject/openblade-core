name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      validation-mode: ${{ steps.scope.outputs.validation-mode }}
      validation-plan-json: ${{ steps.scope.outputs.validation-plan-json }}
      run-quality: ${{ steps.scope.outputs.run-quality }}
      run-contracts: ${{ steps.scope.outputs.run-contracts }}
      run-component-publish: ${{ steps.scope.outputs.run-component-publish }}
      run-installer: ${{ steps.scope.outputs.run-installer }}
      checkout-captures: ${{ steps.scope.outputs.checkout-captures }}
    steps:
      - name: Check out source metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Determine whether the full build is required
        id: scope
        shell: pwsh
        env:
          OPENBLADE_EVENT_NAME: ${{ github.event_name }}
          OPENBLADE_PR_DRAFT: ${{ github.event.pull_request.draft }}
          OPENBLADE_BEFORE_SHA: ${{ github.event.before }}
          OPENBLADE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPENBLADE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENBLADE_CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./build/CiBuildScope.ps1

          $forceFull = $env:OPENBLADE_EVENT_NAME -ne 'pull_request' -or
            $env:OPENBLADE_PR_DRAFT -ne 'true'
          $changedPaths = @()
          if (-not $forceFull) {
            if ($env:OPENBLADE_EVENT_NAME -eq 'pull_request') {
              $baseSha = $env:OPENBLADE_BASE_SHA
              $headSha = $env:OPENBLADE_HEAD_SHA
            }
            else {
              $baseSha = $env:OPENBLADE_BEFORE_SHA
              $headSha = $env:OPENBLADE_CURRENT_SHA
            }

            if ([string]::IsNullOrWhiteSpace($baseSha) -or
                [string]::IsNullOrWhiteSpace($headSha) -or
                $baseSha -match '^0{40}$') {
              $forceFull = $true
            }
            else {
              $changedPaths = @(
                git diff --name-only --no-renames $baseSha $headSha --)
              if ($LASTEXITCODE -ne 0) {
                $changedPaths = @()
                $forceFull = $true
              }
            }
          }

          $plan = Get-OpenBladeCiPlan `
            -ChangedPath $changedPaths `
            -ForceFull:$forceFull
          $planJson = $plan | ConvertTo-Json -Depth 8 -Compress
          $runQuality = @($plan.QualityProjects).Count -gt 0
          $runContracts = @($plan.ContractTests).Count -gt 0
          $runComponentPublish = @($plan.PublishProjects).Count -gt 0 -and
            -not $plan.RunInstaller
          $outputs = [ordered]@{
            'validation-mode' = $plan.Mode
            'validation-plan-json' = $planJson
            'run-quality' = $runQuality.ToString().ToLowerInvariant()
            'run-contracts' = $runContracts.ToString().ToLowerInvariant()
            'run-component-publish' = $runComponentPublish.ToString().ToLowerInvariant()
            'run-installer' = $plan.RunInstaller.ToString().ToLowerInvariant()
            'checkout-captures' = $plan.RequiresCaptures.ToString().ToLowerInvariant()
          }
          foreach ($output in $outputs.GetEnumerator()) {
            "$($output.Key)=$($output.Value)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Format-OpenBladeCiPlan -Plan $plan |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY

  build-and-test:
    needs: classify-changes
    uses: ./.github/workflows/build.yml
    with:
      channel: Stable
      validation-mode: ${{ needs.classify-changes.outputs.validation-mode }}
      validation-plan-json: ${{ needs.classify-changes.outputs.validation-plan-json }}
      run-quality: ${{ needs.classify-changes.outputs.run-quality == 'true' }}
      run-contracts: ${{ needs.classify-changes.outputs.run-contracts == 'true' }}
      run-component-publish: ${{ needs.classify-changes.outputs.run-component-publish == 'true' }}
      run-installer: ${{ needs.classify-changes.outputs.run-installer == 'true' }}
      checkout-captures: ${{ needs.classify-changes.outputs.checkout-captures == 'true' }}
    permissions:
      contents: read
