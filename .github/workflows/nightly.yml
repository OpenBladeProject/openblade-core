name: Nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openblade-nightly
  cancel-in-progress: true

jobs:
  build-and-publish:
    uses: ./.github/workflows/build.yml
    with:
      channel: Nightly
      build-revision: ${{ github.run_number }}
    permissions:
      contents: read
      id-token: write
      attestations: write
